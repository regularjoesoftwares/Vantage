<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vantage — Quick Start Guide</title>
  <meta
    name="description"
    content="The Vantage Quick Start Guide: add a task by voice, type, or Siri; check the details; plan your day; focus and finish."
  >

  <style>
    * { box-sizing: border-box; }

    html, body { margin: 0; }
    html { height: 100%; }

    body {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      color: #172033;
      background: #eef2f7;
    }

    .bar {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 20px;
      background: #ffffff;
      border-bottom: 1px solid #dce3ec;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .bar a {
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      color: #295b9b;
    }

    .bar .download {
      padding: 8px 14px;
      border-radius: 8px;
      background: #295b9b;
      color: #ffffff;
    }

    /* Desktop: the real PDF, full fidelity */
    .viewer {
      flex: 1;
      width: 100%;
      min-height: 80vh;
      border: 0;
    }

    /* Mobile: the two rendered pages, which zoom and read far better
       than a PDF crammed into an iframe */
    .pages {
      display: none;
      padding: 16px 12px 40px;
    }

    .pages img {
      display: block;
      width: 100%;
      max-width: 820px;
      margin: 0 auto 16px;
      border: 1px solid #dce3ec;
      border-radius: 6px;
      box-shadow: 0 2px 10px rgba(23, 32, 51, 0.08);
      background: #fff;
    }

    @media (max-width: 760px) {
      .viewer { display: none; }
      .pages  { display: block; }
    }
  </style>
</head>
<body>

  <div class="bar">
    <a href="index.html">&larr; Vantage</a>
    <a class="download" href="quickstart.pdf" download>Download PDF</a>
  </div>

  <iframe class="viewer" src="quickstart.pdf#view=FitH" title="Vantage Quick Start Guide"></iframe>

  <div class="pages">
    <img src="images/quickstart/qsg-page1.png" alt="Vantage Quick Start Guide, page 1: Add a Task, Plan Your Day, Focus Mode.">
    <img src="images/quickstart/qsg-page2.png" alt="Vantage Quick Start Guide, page 2: Notes, Review, Settings, Additional Features.">
  </div>

</body>
</html>
